<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Het Spelersdossier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE7D6;
    --paper-dark:#DFD5B8;
    --ink:#20242B;
    --ink-soft:#4A4E58;
    --red:#A8342A;
    --green:#2F6B4F;
    --gold:#9C7F3F;
    --line:#B9AD8C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(ellipse at top, #F2ECDC 0%, var(--paper) 45%, #DED2AE 130%);
    min-height:100vh;
    font-family:'IBM Plex Mono', monospace;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px 14px;
  }
  .wrap{width:100%;max-width:600px;}

  .tab{
    display:inline-block;
    background:var(--ink);
    color:var(--paper);
    font-family:'Special Elite', monospace;
    font-size:11px;
    letter-spacing:2px;
    padding:5px 12px;
    transform:rotate(-1deg);
    margin-bottom:-10px;
    margin-left:18px;
    position:relative;
    z-index:2;
  }

  .file{
    background:var(--paper);
    border:1px solid var(--line);
    box-shadow:0 2px 0 var(--line), 0 18px 40px -20px rgba(0,0,0,0.45);
    padding:22px 24px 20px;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .file::before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;bottom:0;
    pointer-events:none;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px);
  }

  header.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:2px solid var(--ink);
    padding-bottom:10px;
    margin-bottom:14px;
  }
  h1{
    font-family:'Special Elite', monospace;
    font-size:19px;
    margin:0;
    letter-spacing:0.5px;
  }
  .lives{
    display:flex;
    gap:4px;
    font-size:19px;
    line-height:1;
  }
  .lives .heart{opacity:1; filter:none; transition:opacity .2s;}
  .lives .heart.lost{opacity:0.22; filter:grayscale(1);}

  .streakbar{
    display:flex;
    gap:8px;
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .streakbar span{
    background:var(--paper-dark);
    border:1px solid var(--line);
    padding:3px 9px;
    white-space:nowrap;
  }
  .streakbar b{color:var(--ink);}

  .clues{
    margin-bottom:14px;
    min-height:225px;
  }
  .clue-row{
    display:flex;
    gap:10px;
    align-items:flex-start;
    padding:9px 0;
    border-bottom:1px dashed var(--line);
    min-height:20px;
  }
  .clue-row:last-child{border-bottom:none;}
  .clue-idx{
    font-family:'Special Elite', monospace;
    font-size:12px;
    color:var(--gold);
    width:16px;
    flex-shrink:0;
    padding-top:1px;
  }
  .clue-text{
    font-size:13.5px;
    line-height:1.55;
    flex:1;
  }
  .clue-text.locked{
    position:relative;
    color:transparent;
    user-select:none;
  }
  .clue-text.locked .redaction{
    position:absolute;
    inset:2px 0;
    background:var(--ink);
    border-radius:1px;
  }
  .clue-text.reveal{
    animation:typeIn 0.35s ease;
  }
  @keyframes typeIn{
    from{opacity:0; transform:translateY(-3px);}
    to{opacity:1; transform:translateY(0);}
  }

  form{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }
  input[type=text]{
    flex:1;
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    padding:11px 12px;
    border:1.5px solid var(--ink);
    background:#FBF8EF;
    color:var(--ink);
    outline:none;
    min-width:0;
  }
  input[type=text]:focus{border-color:var(--red);}
  input[type=text]:disabled{opacity:0.5;}
  button{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.5px;
    padding:11px 16px;
    background:var(--ink);
    color:var(--paper);
    border:1.5px solid var(--ink);
    cursor:pointer;
    text-transform:uppercase;
    flex-shrink:0;
  }
  button:hover:not(:disabled){background:var(--red); border-color:var(--red);}
  button:disabled{opacity:0.4; cursor:not-allowed;}

  .feedback{
    min-height:22px;
    font-size:12.5px;
    margin-bottom:8px;
  }
  .feedback.wrong{color:var(--red);}
  .feedback.win{color:var(--green);}

  .log{
    display:flex;
    flex-direction:column-reverse;
    gap:5px;
    max-height:84px;
    overflow-y:auto;
    margin-bottom:6px;
  }
  .log-item{
    display:flex;
    justify-content:space-between;
    font-size:11.5px;
    padding:5px 9px;
    background:var(--paper-dark);
    border-left:3px solid var(--red);
    color:var(--ink-soft);
  }

  .gameover{
    text-align:center;
    padding:10px 0 4px;
  }
  .gameover .title{
    font-family:'Special Elite', monospace;
    font-size:18px;
    color:var(--red);
    margin-bottom:6px;
  }
  .gameover .name{font-size:14px; margin-bottom:14px;}
  .gameover .name b{font-size:16px;}
  .gameover button{width:100%;}

  footer.note{
    text-align:center;
    font-size:10.5px;
    color:var(--ink-soft);
    margin-top:4px;
    letter-spacing:0.5px;
  }

  @media (max-width:480px){
    h1{font-size:16px;}
    .file{padding:16px 14px 14px;}
    .clues{min-height:255px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="tab">STRIKT VERTROUWELIJK</div>
  <div class="file">
    <header class="top">
      <h1>Het Spelersdossier</h1>
      <div class="lives" id="lives"></div>
    </header>

    <div class="streakbar">
      <span>Huidige reeks: <b id="streak">0</b></span>
      <span>Beste reeks: <b id="best">0</b></span>
    </div>

    <div id="playArea">
      <div class="clues" id="clues"></div>
      <div class="feedback" id="feedback"></div>
      <form id="guessForm">
        <input type="text" id="guessInput" placeholder="Typ de naam van de speler…" autocomplete="off" list="playerSuggestions">
        <datalist id="playerSuggestions"></datalist>
        <button type="submit" id="submitBtn">Gok</button>
      </form>
      <div class="log" id="log"></div>
    </div>

    <div id="gameOverArea" style="display:none;"></div>

    <footer class="note">150+ spelers uit de grootste competities en voetballanden, van vroeger en nu.</footer>
  </div>
</div>

let deck = [];
let current = null;
let clueOrder = [];
let clueIndex = 1;
let lives = 3;
let streak = 0;
let best = 0;
const MAX_LIVES = 3;
const MAX_CLUES = 5;
let gameOver = false;

const livesEl = document.getElementById('lives');
const cluesEl = document.getElementById('clues');
const formEl = document.getElementById('guessForm');
const inputEl = document.getElementById('guessInput');
const submitBtn = document.getElementById('submitBtn');
const feedbackEl = document.getElementById('feedback');
const logEl = document.getElementById('log');
const streakEl = document.getElementById('streak');
const bestEl = document.getElementById('best');
const playArea = document.getElementById('playArea');
const gameOverArea = document.getElementById('gameOverArea');

const suggestionsEl = document.getElementById('playerSuggestions');
const ALL_NAMES = PLAYERS.map(p => p.n);

function updateSuggestions(){
  const q = normalize(inputEl.value);
  suggestionsEl.innerHTML = '';
  if(q.length < 2) return;

  const starts = [];
  const contains = [];
  for(const name of ALL_NAMES){
    const nNorm = normalize(name);
    if(nNorm.startsWith(q)) starts.push(name);
    else if(nNorm.includes(q)) contains.push(name);
  }
  const matches = starts.concat(contains).slice(0, 5);
  matches.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    suggestionsEl.appendChild(opt);
  });
}

inputEl.addEventListener('input', updateSuggestions);

function normalize(s){
  return s.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9\s]/g,'')
    .trim();
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function refillDeckIfNeeded(){
  if(deck.length===0){
    deck = shuffle(PLAYERS);
  }
}

async function loadStats(){
  try{
    const r = await window.storage.get('voetbaldossier-stats');
    if(r && r.value){
      const parsed = JSON.parse(r.value);
      best = parsed.best || 0;
    }
  }catch(e){ /* nog geen opgeslagen record */ }
  bestEl.textContent = best;
}

async function saveBest(){
  try{
    await window.storage.set('voetbaldossier-stats', JSON.stringify({best}));
  }catch(e){ /* opslaan mislukt, geen probleem voor het spel zelf */ }
}

function renderLives(){
  livesEl.innerHTML = '';
  for(let i=0;i<MAX_LIVES;i++){
    const h = document.createElement('span');
    h.className = 'heart' + (i < lives ? '' : ' lost');
    h.textContent = '♥';
    livesEl.appendChild(h);
  }
}

function renderClues(){
  cluesEl.innerHTML = '';
  for(let i=0;i<MAX_CLUES;i++){
    const row = document.createElement('div');
    row.className = 'clue-row';
    const idx = document.createElement('div');
    idx.className = 'clue-idx';
    idx.textContent = (i+1)+'.';
    const text = document.createElement('div');
    if(i < clueIndex){
      text.className = 'clue-text reveal';
      text.textContent = current.c[clueOrder[i]];
    } else {
      text.className = 'clue-text locked';
      text.innerHTML = '<span class="redaction"></span>' + current.c[clueOrder[i]];
    }
    row.appendChild(idx);
    row.appendChild(text);
    cluesEl.appendChild(row);
  }
}

function renderLog(){
  logEl.innerHTML = '';
}

function startRound(){
  const existingBtn = document.getElementById('continueBtn');
  if(existingBtn) existingBtn.remove();
  refillDeckIfNeeded();
  current = deck.pop();
  clueOrder = shuffle([0,1,2,3,4]);
  clueIndex = 1;
  inputEl.value = '';
  inputEl.disabled = false;
  submitBtn.disabled = false;
  feedbackEl.textContent = '';
  feedbackEl.className = 'feedback';
  renderLives();
  renderClues();
  renderLog();
  inputEl.focus();
}

function newGame(){
  lives = MAX_LIVES;
  streak = 0;
  gameOver = false;
  streakEl.textContent = streak;
  playArea.style.display = 'block';
  gameOverArea.style.display = 'none';
  startRound();
}

function endGame(){
  gameOver = true;
  inputEl.disabled = true;
  submitBtn.disabled = true;
  if(streak > best){
    best = streak;
    bestEl.textContent = best;
    saveBest();
  }
  playArea.style.display = 'none';
  gameOverArea.style.display = 'block';
  gameOverArea.innerHTML = `
    <div class="gameover">
      <div class="title">Game over</div>
      <div class="name">Deze speler bleef onbekend: <b>${current.n}</b><br>Eindreeks: <b>${streak}</b></div>
      <button id="restartBtn">Nieuw spel starten</button>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', newGame);
}

function showContinueButton(){
  const existing = document.getElementById('continueBtn');
  if(existing) existing.remove();
  const btn = document.createElement('button');
  btn.id = 'continueBtn';
  btn.textContent = 'Volgende speler →';
  btn.style.width = '100%';
  btn.style.marginTop = '6px';
  btn.addEventListener('click', ()=>{
    btn.remove();
    startRound();
  });
  playArea.appendChild(btn);
}

formEl.addEventListener('submit', (e)=>{
  e.preventDefault();
  if(gameOver) return;
  const raw = inputEl.value.trim();
  if(!raw) return;

  const guessNorm = normalize(raw);
  const nameNorm = normalize(current.n);
  const nameParts = nameNorm.split(/\s+/);
  const surnameCandidates = new Set([nameNorm]);
  for(let i=1;i<=Math.min(3, nameParts.length-1);i++){
    surnameCandidates.add(nameParts.slice(-i).join(' '));
  }
  const correct = guessNorm.length > 2 && surnameCandidates.has(guessNorm);

  if(correct){
    streak += 1;
    streakEl.textContent = streak;
    feedbackEl.textContent = '✓ Correct! Op naar de volgende speler…';
    feedbackEl.className = 'feedback win';
    inputEl.disabled = true;
    submitBtn.disabled = true;
    setTimeout(startRound, 850);
  } else {
    inputEl.value = '';
    if(clueIndex < MAX_CLUES){
      clueIndex += 1;
      renderClues();
      feedbackEl.textContent = `✕ "${raw}" is niet juist — volgende aanwijzing erbij.`;
      feedbackEl.className = 'feedback wrong';
    } else {
      // Alle aanwijzingen zijn op en de speler is niet geraden: 1 hartje kwijt
      lives -= 1;
      renderLives();
      inputEl.disabled = true;
      submitBtn.disabled = true;
      if(lives <= 0){
        feedbackEl.innerHTML = `✕ Niet geraden — het was <b>${current.n}</b>. Geen levens meer over.`;
        feedbackEl.className = 'feedback wrong';
        setTimeout(endGame, 1600);
      } else {
        feedbackEl.innerHTML = `✕ Niet geraden — het was <b>${current.n}</b>. Je verliest een hartje.`;
        feedbackEl.className = 'feedback wrong';
        showContinueButton();
      }
    }
  }
});

loadStats().then(newGame);
</script>
