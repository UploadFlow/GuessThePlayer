  - generic [ref=e67]:
    - generic [ref=e68]: Wil jij met de beste begeleiding (leren) hardlopen? Kom voor verantwoorde trainingen naar het Lopersproject.
    - generic [ref=e69]:
      - paragraph [ref=e70]: Het Lopersproject is een jaarlijks terugkerend initiatief onder de vlag van de Westlandse Atletiekvereniging Olympus ’70 in Naaldwijk.
      - paragraph [ref=e71]:
        - text: Het lopersproject start ieder jaar in januari en september. De editie van januari heeft als vertreklocatie sporthal Verburch.
        - strong [ref=e72]: In september is de vertreklocatie Sporthal de Wielepet in Ter Heijde.
      - paragraph [ref=e73]: Er kan getraind worden voor diverse onderdelen onder begeleiding van professionele trainers. Zo zijn er groepen voor de starters (5km), 5 km, 10km, halve marathon, maar ook wandelgroepen 5 en 10km.
